<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:14px;color:#000;background:#fff;display:flex;flex-direction:column;overflow:hidden}
/* barra estilo Google Sheets */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px 4px;background:#fff}
.ico{width:32px;height:40px;background:#0f9d58;border-radius:4px;position:relative;flex:none}
.ico::after{content:"";position:absolute;left:7px;right:7px;top:12px;bottom:10px;border:2px solid #fff;background:linear-gradient(#fff,#fff) 50% 0/2px 100% no-repeat,linear-gradient(#fff,#fff) 0 50%/100% 2px no-repeat}
.ttl{font-family:"Google Sans",Arial,sans-serif;font-size:18px;color:#202124}
.menu{display:flex;gap:2px;font-family:Arial,sans-serif;font-size:13px}
.menu button,.menu label{background:none;border:none;padding:4px 8px;border-radius:4px;cursor:pointer;color:#202124;font:inherit}
.menu button:hover,.menu label:hover{background:#f1f3f4}
.fbar{display:flex;align-items:center;border-top:1px solid #e0e0e0;border-bottom:1px solid #c0c0c0;background:#fff;font-family:Arial,sans-serif;font-size:13px;height:30px}
.namebox{width:90px;padding:0 8px;border-right:1px solid #e0e0e0;height:100%;display:flex;align-items:center;color:#202124}
.fx{padding:0 10px;color:#5f6368;font-style:italic;border-right:1px solid #e0e0e0;height:100%;display:flex;align-items:center}
.fxv{padding:0 10px;color:#202124;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.filt{display:flex;gap:8px;align-items:center;padding:6px 12px;background:#f8f9fa;border-bottom:1px solid #e0e0e0;font-family:Arial,sans-serif;font-size:12px;flex-wrap:wrap}
.filt input,.filt select{font:12px Arial;padding:3px 5px;border:1px solid #c0c0c0;border-radius:3px}
.filt button{font:12px Arial;padding:4px 10px;border:1px solid #c0c0c0;border-radius:3px;background:#fff;cursor:pointer}
.filt button.pri{background:#1a73e8;color:#fff;border-color:#1a73e8}
.wrap{flex:1;overflow:auto;position:relative;background:#fff}
/* grade */
table.g{border-collapse:collapse;table-layout:fixed}
table.g th.cl{background:#f8f9fa;color:#5f6368;font:11px Arial;border:1px solid #c0c0c0;height:20px;position:sticky;top:0;z-index:3;font-weight:normal}
table.g th.rn{background:#f8f9fa;color:#5f6368;font:11px Arial;border:1px solid #c0c0c0;width:46px;min-width:46px;position:sticky;left:0;z-index:2;font-weight:normal}
table.g th.corner{position:sticky;left:0;top:0;z-index:4;background:#f8f9fa;border:1px solid #c0c0c0}
table.g td{height:21px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle;text-align:center;font-size:14px}
table.g td.b{border:1px solid #000}
table.g td.sel{outline:2px solid #1a73e8;outline-offset:-2px}
table.g td.l{text-align:left}table.g td.r{text-align:right}
table.g td.bo{font-weight:bold}
table.g input.ci,table.g select.ci{width:100%;border:none;background:transparent;font:inherit;color:inherit;text-align:inherit;padding:0;height:20px;outline:none}
table.g input.ci:focus,table.g select.ci:focus{background:#fff}
table.g input[type=date].ci,table.g input[type=time].ci{text-align:center}
table.g input.ci::-webkit-calendar-picker-indicator{opacity:.35;margin:0}
table.g input[type=number].ci::-webkit-inner-spin-button{display:none}
.stk{position:sticky;z-index:1}
/* abas */
.tabs{display:flex;align-items:stretch;background:#f1f3f4;border-top:1px solid #c0c0c0;height:38px;font-family:Arial,sans-serif;font-size:13px;overflow-x:auto;flex:none}
.tabs .add{width:40px;display:flex;align-items:center;justify-content:center;color:#5f6368;font-size:20px}
.tabs button{border:none;background:none;padding:0 16px;cursor:pointer;color:#3c4043;white-space:nowrap;font:inherit;border-right:1px solid #dadce0;position:relative}
.tabs button:hover{background:#e8eaed}
.tabs button.on{background:#e1e9f7;color:#1967d2;font-weight:bold}
.tabs button.on::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:#1967d2}
.tabs button.x{color:#188038}
.toast{position:fixed;bottom:56px;left:50%;transform:translateX(-50%) translateY(10px);background:#323232;color:#fff;padding:10px 18px;border-radius:4px;font:14px Arial;opacity:0;transition:.2s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%)}
.pane{display:none}.pane.on{display:block}
.cards{display:flex;gap:10px;flex-wrap:wrap;padding:12px}
.kc{border:1px solid #000;min-width:170px}
.kc .h{background:#FFE599;color:#5B0F00;font-weight:bold;padding:4px 8px;font-size:13px;border-bottom:1px solid #000}
.kc .v{font-size:22px;font-weight:bold;padding:6px 8px}
.box{border:1px solid #000;margin:12px;display:inline-block;vertical-align:top}
.box .h{background:#FFE599;color:#5B0F00;font-weight:bold;padding:4px 8px;border-bottom:1px solid #000}
.cap th.cl,.cap th.rn,.cap th.corner{display:none}
.rowdel{cursor:pointer}
.rowdel:hover{background:#fce8e6!important;color:#c5221f!important}

.mbg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:24px}
.mbg.on{display:flex}
.mbox{background:#f1f3f4;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.mbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-family:Arial}
.mbar button{font:13px Arial;padding:8px 14px;border-radius:6px;border:1px solid #c0c0c0;background:#fff;cursor:pointer}
.mbar button.pri{background:#137333;color:#fff;border-color:#137333;font-weight:bold}
#repCard{-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;width:1040px;background:#fff;font-family:Calibri,Carlito,Arial,sans-serif;color:#1b1b1b;border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.rh{background:linear-gradient(120deg,#0b2447,#1b4b86);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.rh .t1{font-size:13px;letter-spacing:2px;opacity:.8;font-weight:bold}
.rh .t2{font-size:24px;font-weight:bold;margin-top:2px}
.rh .t3{font-size:14px;opacity:.9;margin-top:4px}
.rh .big{text-align:right}.rh .big b{font-size:34px;display:block;line-height:1}.rh .big span{font-size:12px;opacity:.85}
.rk{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:14px 16px 4px}
.rk div{border:1px solid #e3e3e3;border-radius:10px;padding:9px 12px;border-left:5px solid #F1C232}
.rk div.g{border-left-color:#34A853}.rk div.r{border-left-color:#EA4335}.rk div.b{border-left-color:#1155CC}
.rk small{display:block;font-size:11px;font-weight:bold;color:#666;text-transform:uppercase;letter-spacing:.5px}
.rk b{font-size:21px}.rk i{font-style:normal;font-size:12px;color:#555;display:block}
.rs{padding:8px 16px}
.rs .bt{font-weight:bold;font-size:14px;padding:5px 10px;border-radius:6px 6px 0 0;border:1px solid #000;border-bottom:none;display:inline-block}
.rs table{width:100%;border-collapse:collapse;font-size:14px}
.rs th{background:#FFE599;color:#5B0F00;border:1px solid #000;padding:4px 3px;font-size:12.5px}
.rs th.s{background:#FFE599;color:#1b1b1b}
.rs td{border:1px solid #000;padding:3px 4px;text-align:center}
.rs tr.tt td{background:#FFFF99;font-weight:bold}
.rs .ok{background:#B7E1CD}.rs .no{background:#F4C7C3}
.rd{padding:6px 16px 4px}.rd .it{font-size:13.5px;margin:3px 0}.rd .it b{background:#FFF2CC;border:1px solid #e0c97a;border-radius:4px;padding:0 5px;margin-right:6px;font-size:12px}
.rf{display:flex;justify-content:space-between;padding:10px 18px;font-size:11.5px;color:#777;border-top:1px solid #eee;margin-top:8px}

#repCardKr{width:1320px;background:#fff;font-family:Calibri,Carlito,Arial,sans-serif;color:#000;padding-bottom:6px}
.kr-top{display:flex;align-items:stretch;height:74px;background:linear-gradient(180deg,#FFD966 0%,#FFE599 45%,#FFF2CC 100%)}
.kr-logo{width:190px;background:#fff;display:flex;align-items:center;justify-content:center;padding:6px}
.kr-logo img,.kr-logor img{max-height:60px;max-width:180px}
.kr-logo span{font:bold 15px Arial;color:#0b3d91;letter-spacing:.5px;text-align:center}
.kr-logor{margin-left:auto;display:flex;align-items:center;padding:0 22px}
.kr-logor span{font:bold 20px Arial;color:#2d3277}
.kr-mid{flex:1;display:flex;align-items:center;justify-content:center;font:bold 20px Calibri,Arial;color:#5B0F00;letter-spacing:1px}
.kr-dc{display:flex;gap:50px;padding:6px 0 0 44px}
.kr-dc div{background:#CFE2F3;padding:3px 14px;font-weight:bold;font-size:15px;min-width:190px;display:flex;gap:22px}
.kr-body{display:flex;gap:40px;padding:14px 10px 0 0;align-items:flex-start}
.kr-bar{background:#CFE2F3;border-radius:6px 6px 0 0;text-align:center;font:bold 20px Calibri,Arial;padding:3px 0;letter-spacing:.5px}
.kr table{border-collapse:collapse;font-size:14.5px}
.kr td{border:1px dotted #000;height:21px;padding:0 4px;text-align:center;white-space:nowrap}
.kr td.hd{font-weight:bold;height:38px;line-height:1.05}
.kr td.br{color:#5B0F00}
.kr td.y{background:#FFE599;font-weight:bold}
.kr td.ly{background:#FFFF99;font-weight:bold}
.kr td.bo{font-weight:bold}
.kr td.gv{background:#B7E1CD}
.kr td.lab{border:none;font-weight:bold;font-size:15px;width:44px}
.kr td.nb{border:none}
.kr-sum{display:flex;justify-content:space-between;padding:6px 10px 0 0}
.kr-dia{margin:8px 0 0 0;border-top:1px dotted #000}
.kr-dia td{text-align:left}

.rk4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 16px 4px}
.rk4 .c{border:1px solid #e3e3e3;border-radius:10px;padding:9px 12px;border-left:5px solid #F1C232}
.rk4 .c.b{border-left-color:#1155CC}.rk4 .c.g{border-left-color:#34A853}.rk4 .c.r{border-left-color:#EA4335}
.rk4 small{display:block;font-size:11px;font-weight:bold;color:#666;text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.rk4 .ln{display:flex;justify-content:space-between;font-size:13.5px;line-height:1.45}.rk4 .ln b{font-size:14.5px}
.rk4 .ln.t{border-top:1px solid #eee;margin-top:2px;padding-top:2px}.rk4 .ln.t b{font-size:17px}
.rs th.sp,.rs td.sp{border:none;background:none;width:8px;padding:0}
.rs th.so{background:#CFE2F3;color:#0b2447}
.rh .lgs{display:flex;gap:10px;align-items:center}.rh .lgs img{max-height:44px;background:#fff;border-radius:6px;padding:3px 6px}
</style>

/* ---------- construtor de grade (planilha) ----------

function grid(cols,rows,opt={}){
  const start=opt.startCol||0;
  const tw=46+cols.reduce((a,c)=>a+c.w,0);
  let h=`<table class="g" id="${opt.id||''}" style="width:${tw}px"><colgroup><col style="width:46px">${cols.map(c=>`<col style="width:${c.w}px">`).join('')}</colgroup><thead><tr><th class="corner"></th>${cols.map((c,i)=>`<th class="cl">${L(start+i)}</th>`).join('')}</tr></thead><tbody>`;
  const occ={};
  rows.forEach((r,ri)=>{
    h+=`<tr${r.h?` style="height:${r.h}px"`:''}><th class="rn${r.del?' rowdel':''}"${r.del?` data-del="${r.del}" title="Clique para excluir a linha"`:''}>${r.n}</th>`;
    let ci=0;
    const cells=r.cells||[];let k=0;
    while(ci<cols.length){
      if(occ[ri+'|'+ci]){ci++;continue}
      const c=cells[k++];
      if(!c){h+=`<td data-ref="${L(start+ci)}${r.n}"></td>`;ci++;continue}
      if(c===0||c.skip){h+=`<td data-ref="${L(start+ci)}${r.n}"></td>`;ci++;continue}
      const cs=c.cs||1,rs=c.rs||1;
      for(let a=0;a<rs;a++)for(let b=0;b<cs;b++)if(a||b)occ[(ri+a)+'|'+(ci+b)]=1;
      h+=`<td data-ref="${L(start+ci)}${r.n}"${cs>1?` colspan="${cs}"`:''}${rs>1?` rowspan="${rs}"`:''} class="${c.k||''}" style="${c.s||''}"${c.f?` data-f="${esc(c.f)}"`:''}${c.a||''}>${c.v??''}</td>`;
      ci+=cs;
    }
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

function calcDia(d,c){
  const R=DB.rows.filter(r=>r.d===d&&r.c===c&&r.h);
  const maxH=Math.max(8,...R.map(r=>r.h));
  const H={};let prev=null;
  for(let h=1;h<=maxH;h++){
    const rs=R.filter(r=>r.h===h),rp=rs.filter(r=>r.p!=null&&r.p!=='');
    const cel={};rp.forEach(r=>{if(r.e)cel[r.e]=(cel[r.e]||0)+(+r.p)});
    const tot=rp.reduce((a,r)=>a+(+r.p),0);
    const rsS=rs.find(r=>r.s!=null&&r.s!=='');const rsH=rs.find(r=>r.hh!=null&&r.hh!=='');const rsG=rs.find(r=>r.g!=null&&r.g!=='');
    let s=rsS?+rsS.s:null;
    if(h===5)prev=null;
    if(DB.cfg.sortMode==='acum'&&s!=null){const raw=s;s=prev!=null&&raw>=prev?raw-prev:raw;prev=raw}
    const durs=rs.map(r=>durM(r.i,r.f)).filter(v=>v!=null);
    H[h]={h,rs,cel,tot,O:rs.length,du:rp.length,ini:rs.find(r=>r.i)?.i||'',fim:rs.find(r=>r.f)?.f||'',s,hh:rsH?+rsH.hh:null,g:rsG?+rsG.g:null,
      tproc:durs.length?durs.reduce((a,b)=>a+b,0)/durs.length:null,media:rp.length?tot/Object.values(cel).filter(v=>v>0).length:null};
  }
  const inis=R.map(r=>tmin(r.i)).filter(v=>v!=null),fins=R.map(r=>tmin(r.f)).filter(v=>v!=null);
  const ini=inis.length?Math.min(...inis):null,fim=fins.length?Math.max(...fins):null;
  const porE={};R.forEach(r=>{if(r.e&&r.p!=null&&r.p!=='')porE[r.e]=(porE[r.e]||0)+(+r.p)});
  const total=Object.values(porE).reduce((a,b)=>a+b,0);
  const sf=R.find(r=>r.sf)?.sf||'';
  const dia=DB.dias[d+'|'+c]||{};
  const ex={};['exp','carros','qtdLogs','expIni','expFim','imp','rotasPos','pctsPos','feirinha'].forEach(k=>{const r=R.find(x=>x[k]!=null&&x[k]!=='');if(r)ex[k]=r[k]});
  const obs=R.map(r=>r.obs).filter(Boolean).join(' | ');
  const tReal=Object.values(H).reduce((a,x)=>a+(x.tproc||0),0);
  return {d,c,R,H,maxH,ini,fim,porE,total,sf,dia,ex,obs,tReal};
}

function cellTime(v){if(v==null||v==='')return'';if(v instanceof Date)return String(v.getHours()).padStart(2,'0')+':'+String(v.getMinutes()).padStart(2,'0');if(typeof v==='number')return mint((v%1)*1440);const m=String(v).match(/(\d{1,2}):(\d{2})/);return m?m[1].padStart(2,'0')+':'+m[2]:''}
function cellDate(v){if(v instanceof Date){const d=new Date(v.getTime()+12*36e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);const m=String(v||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;const m2=String(v||'').match(/\d{4}-\d{2}-\d{2}/);return m2?m2[0]:''}

function buildReport(){
  const vuc=S.tab==='vdash';const X=dashRows(vuc);const [A,B]=X.tots;
  const tot=A.L+B.L,esp=A.M+B.M,dif=tot-esp,at=esp?tot/esp:null,sort=A.R+B.R,hh=A.S+B.S;

  const sg=v=>v==null||!isFinite(v)?'':(v>0?'+':'')+N(v);const z=v=>v==null||v===''?'':N(v);
  const dn=DOW[new Date(X.d+'T12:00').getDay()];const L0=X.lab[0],L1=X.lab[1];

   <div class="c ${at!=null&&at>=1?'g':'r'}"><small>🏷️ Total etiquetagem</small>${ln(L0,N(A.L))}${ln(L1,N(B.L))}${ln('TOTAL',N(tot),'t')}<div class="ln"><span>Esperado ${N(esp)}</span><b style="color:${dif>=0?'#137333':'#C5221F'}">${sg(dif)} (${at!=null?P(at,1):'—'})</b></div></div>
   <div class="c b"><small>🔀 Total sorting</small>${ln(L0,N(A.R))}${ln(L1,N(B.R))}${ln('TOTAL',N(sort),'t')}<div class="ln"><span>${N(hh)} HH</span><b>${hh?N(sort/hh)+' /HH':''}</b></div></div>
   <div class="c"><small>🗺️ Total roteirizado</small>${ln(L0,z(X.r1)||'—')}${ln(L1,z(X.r2)||'—')}${ln('TOTAL',temRot?N(rot):'—','t')}<div class="ln"><span>Diferença</span><b>${X.r1!=null?N(X.r1-A.L):'—'} | ${X.r2!=null?N(X.r2-B.L):'—'} | ${temRot?N(rot-tot):'—'}</b></div></div>
   <div class="c"><small>⏱️ Horários</small>${ln('Início | '+L0,X.ini1||'—')}${ln('Início | '+L1,X.ini2||'—')}${ln('Término',X.term||'—')}${ln('Tempo operação',X.tOp!=null?hhmm(X.tOp):'—','t')}</div></div>`;
  let algum=false;
  [0,1].forEach(bi=>{
    const H=X.hrs.filter(x=>x.bi===bi&&(x.O||x.Rv!=null));if(!H.length)return;algum=true;const T=X.tots[bi];
    const cols=[1,2,3,4,5,6,7,8].filter(i=>X.hrs.some(x=>x.cel[i]!=null)||i<=4);

    <tr>${cols.map(i=>`<th style="min-width:50px">${i}</th>`).join('')}<th class="so">TOTAL</th><th class="so">HH</th><th class="so">MÉDIA</th><th class="so">ESPERADO</th><th class="so">≠</th></tr>
    ${H.map(x=>`<tr><td style="white-space:nowrap"><b>${x.ini}–${x.fim}</b></td>${cols.map(i=>`<td>${z(x.cel[i])}</td>`).join('')}<td><b>${N(x.tot)}</b></td><td>${N(x.M)}</td><td class="${x.O?(x.Nd>=0?'ok':'no'):''}">${x.O?sg(x.Nd):''}</td><td>${x.O||''}</td><td class="${x.Pm!=null&&x.Pm>=DB.cfg.mediaVerde?'ok':''}"><b>${z(x.Pm)}</b></td><td class="sp"></td><td>${z(x.Rv)}</td><td>${z(x.Sv)}</td><td>${z(x.Tv)}</td><td>${x.Sv?N(x.U):''}</td><td class="${x.Rv!=null&&x.Sv?(x.V>=0?'ok':'no'):''}">${x.Rv!=null&&x.Sv?sg(x.V):''}</td></tr>`).join('')}
    <tr class="tt"><td>TOTAL</td>${cols.map(i=>`<td>${z(T.cel[i])}</td>`).join('')}<td>${N(T.L)}</td><td>${N(T.M)}</td><td>${sg(T.N)}</td><td>${T.O||''}</td><td>${z(T.O?T.L/T.O:null)}</td><td class="sp"></td><td>${N(T.R)}</td><td>${N(T.S)}</td><td>${z(T.S?T.R/T.S:null)}</td><td>${N(T.U)}</td><td>${sg(T.V)}</td></tr></table></div>`;
  });

  const dItems=Object.entries(X.di).filter(([,v])=>v&&String(v).trim()).sort((a,b)=>a[0]-b[0]);

  tx+=`🔀 *Total sorting:* ${L0} ${N(A.R)} | ${L1} ${N(B.R)} | *Total ${N(sort)}*${hh?` | ${N(hh)} HH`:''}\n`;

  tx+=`⏱️ *Início ${L0}:* ${X.ini1||'—'} | *Início ${L1}:* ${X.ini2||'—'} | *Término:* ${X.term||'—'} | *Tempo:* ${X.tOp!=null?hhmm(X.tOp):'—'}\n`;
  [0,1].forEach(bi=>{const H=X.hrs.filter(x=>x.bi===bi&&(x.O||x.Rv!=null));if(!H.length)return;tx+=`\n*${X.lab[bi]}*\n`;H.forEach(x=>{
    const et=Object.entries(x.cel).map(([e,v])=>`${e}:${N(v)}`).join(' ');
    tx+=`${x.O?(x.Nd>=0?'✅':'🔻'):'▫️'} *${x.ini}-${x.fim}:* ${N(x.tot)} / esp ${N(x.M)} (≠ ${sg(x.Nd)}) · ${x.O} ${vuc?'logs':'duplas'} · média ${z(x.Pm)||'—'}\n`;
    if(et)tx+=`   ${et}\n`;

  if(dItems.length){tx+=`\n📝 *Diário de bordo*\n`;dItems.forEach(([k,v])=>tx+=`• ${+k<=4?L0:L1} ${(+k-1)%4+1}ª HORA: ${v}\n`)}

async function repCanvas(){toast('Gerando imagem em alta qualidade…');if(typeof html2canvas==='undefined'){toast('Biblioteca de imagem não carregou');return null}await (document.fonts?document.fonts.ready:Promise.resolve());return html2canvas($('#repCard'),{scale:3,backgroundColor:'#ffffff',useCORS:true,letterRendering:true,logging:false,windowWidth:1200})}
$('#rCopy').onclick=async()=>{const cv=await repCanvas();if(!cv)return;cv.toBlob(async b=>{try{await navigator.clipboard.write([new ClipboardItem({'image/png':b})]);toast('Report copiado — cole no grupo do WhatsApp')}catch(e){dl(b)}})};
function dl(b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`report_${S.tab==='vdash'?'vuc':'sorting'}_${(S.tab==='vdash'?S.vdash:S.dash).d}.png`;a.click();toast('Imagem baixada')}
$('#rDown').onclick=async()=>{const cv=await repCanvas();if(cv)cv.toBlob(dl)};
$('#rTxt').onclick=async()=>{try{await navigator.clipboard.writeText(repTxt);toast('Texto copiado — cole no WhatsApp')}catch(e){prompt('Copie o texto:',repTxt)}};

render();
</script>
</body>
